<div class="p-6">
  <div class="flex justify-between align-middle gap-4 my-2">
    <mat-form-field class="py-4">
      <mat-select
        placeholder="Filter publishers"
        (selectionChange)="applyFilter($event.value)"
      >
        <mat-option *ngFor="let parent of parents" [value]="parent.id">
          {{ parent.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <span>Add</span>
    </button>
  </div>

  <table mat-table [dataSource]="filteredChildren" class="min-w-full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let child">{{ child.name }}</td>
    </ng-container>

    <ng-container matColumnDef="issueNumber">
      <th mat-header-cell *matHeaderCellDef>Issue number</th>
      <td mat-cell *matCellDef="let child">{{ child.issueNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="parent">
      <th mat-header-cell *matHeaderCellDef>Botuesi</th>
      <td mat-cell *matCellDef="let child">{{ child.parent.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let child">
        <button mat-icon-button (click)="openDialog(child)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(child.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [length]="children.length"
    [pageSize]="10"
    [pageSizeOptions]="[15, 25, 100]"
    aria-label="Select page"
  >
  </mat-paginator>
</div>
