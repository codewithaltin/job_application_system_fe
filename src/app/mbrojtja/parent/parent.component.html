<div class="p-6">
  <div class="flex justify-between align-middle gap-4 my-4">
    <button mat-raised-button color="primary" (click)="openDialog()">
      <span>Add</span>
    </button>
  </div>

  <table mat-table [dataSource]="parents" class="min-w-full">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Name</th>
      <td mat-cell *matCellDef="let parent" class="border-b border-gray-300">
        {{ parent.name }}
      </td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="nationality">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Nationality</th>
      <td mat-cell *matCellDef="let parent" class="border-b border-gray-300">
        {{ parent.nationality }}
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Actions</th>
      <td mat-cell *matCellDef="let parent" class="border-b border-gray-300">
        <button
          mat-icon-button
          (click)="openDialog(parent)"
          aria-label="Edit"
          class="text-blue-500 hover:text-blue-700"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="softDeleteParent(parent.id)"
          aria-label="Delete"
          class="text-red-500 hover:text-red-700"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="parents.length"
    [pageSize]="10"
    [pageSizeOptions]="[15, 25, 100]"
    aria-label="Select page"
  >
  </mat-paginator>
</div>
